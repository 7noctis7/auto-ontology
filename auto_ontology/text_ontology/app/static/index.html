<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontologie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4.5' cy='8' r='2.2' fill='%230072B2'/%3E%3Ccircle cx='11.5' cy='5.5' r='2.2' fill='%23E69F00'/%3E%3Cpath d='M6.5 7.4 L9.4 6.1' stroke='%235c6b80' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <input id="project-name" class="project-name" type="text" aria-label="Nom du projet" placeholder="Projet" disabled>
    <button type="button" id="new-project" data-i18n="newProject">Nouveau projet</button>
    <select id="project-switch" class="project-switch" hidden aria-label="Projets"></select>
  </div>
  <nav class="views" aria-label="Vues">
    <button type="button" data-view="graph" class="is-on" data-i18n="viewGraph">Graphe</button>
    <button type="button" data-view="hierarchy" data-i18n="viewTree">Hiérarchie</button>
    <button type="button" data-view="glossary" data-i18n="viewGlossary">Glossaire</button>
    <button type="button" data-view="facts" data-i18n="viewFacts">Faits</button>
    <button type="button" data-view="documents" data-i18n="viewDocuments">Documents</button>
    <button type="button" data-view="analysis" data-i18n="viewAnalysis">Analyse</button>
    <button type="button" data-view="dashboards" data-i18n="viewBoards">Tableaux</button>
    <button type="button" data-view="guide" data-i18n="viewGuide">Guide</button>
  </nav>
  <input id="search" type="search" data-i18n-placeholder="search" placeholder="Rechercher…" autocomplete="off" aria-label="Recherche">
  <div class="top-actions">
    <button type="button" id="add-btn" data-i18n="add">Ajouter</button>
    <button type="button" id="undo-btn" data-i18n="undo" title="Ctrl+Z" disabled>Annuler</button>
    <button type="button" id="redo-btn" data-i18n="redo" title="Ctrl+Maj+Z" disabled>Rétablir</button>
    <details id="download" class="menu">
      <summary data-i18n="download">Télécharger</summary>
      <div class="menu-list" id="download-list"></div>
    </details>
    <button type="button" id="settings-btn" data-i18n="settings">Réglages</button>
    <button type="button" id="theme-btn" data-i18n="theme">Sombre</button>
    <button type="button" id="lang-btn" aria-label="Language">EN</button>
  </div>
</header>

<p id="banner" class="banner" hidden></p>
<p id="toast" class="toast" hidden></p>

<section id="kpis" class="kpis" aria-label="Indicateurs"></section>
<p id="insight" class="insight"></p>

<div class="workspace">
  <main id="stage">
    <div id="empty" class="empty">
      <label id="drop-zone" class="drop-zone" for="file-input">
        <strong data-i18n="dropTitle">Déposez un document</strong>
        <span data-i18n="dropHint">PDF, EPUB, DOCX, HTML, Markdown ou texte</span>
      </label>
      <form id="paste-form" class="paste">
        <textarea id="paste" rows="4" data-i18n-placeholder="paste" placeholder="Ou collez un passage…"></textarea>
        <div class="paste-actions">
          <button type="submit" data-i18n="extract">Extraire</button>
          <button type="button" id="sample-btn" class="primary" data-i18n="sample">Essayer l'exemple</button>
        </div>
      </form>
    </div>
    <div id="graph-wrap">
      <div id="graph"></div>
      <div class="graph-tools">
        <label><input type="checkbox" id="show-types"> <span data-i18n="showTypes">Liens de type</span></label>
        <label><input type="checkbox" id="classes-only"> <span data-i18n="classesOnly">Classes seules</span></label>
        <label><input type="checkbox" id="show-literals"> <span data-i18n="literals">Littéraux</span></label>
        <label><input type="checkbox" id="focus-mode"> <span data-i18n="focus">Focus</span></label>
        <label><input type="checkbox" id="communities"> <span data-i18n="communities">Communautés</span></label>
        <select id="layout" aria-label="Disposition">
          <option value="force" data-i18n="layoutForce">Force</option>
          <option value="hierarchy">Hiérarchie</option>
          <option value="circle">Cercle</option>
        </select>
        <button type="button" id="fit-btn" data-i18n="fit">Recentrer</button>
        <span id="legend" class="legend"></span>
        <canvas id="minimap" width="148" height="92" aria-hidden="true"></canvas>
      </div>
    </div>
    <div id="table-view" class="table-view" hidden></div>
    <div id="tree-view" class="tree-view" hidden></div>
    <div id="panel-view" class="panel-view" hidden></div>
  </main>
  <aside id="side" class="side" aria-live="polite"></aside>
</div>

<div id="progress" class="progress" hidden>
  <div class="progress-row">
    <span id="progress-label"></span>
    <button type="button" id="cancel-btn" data-i18n="cancel">Annuler l'extraction</button>
  </div>
  <div class="bar" aria-hidden="true"><span id="progress-bar"></span></div>
  <ol id="progress-list"></ol>
</div>

<input id="file-input" type="file" hidden multiple accept=".txt,.md,.markdown,.pdf,.epub,.docx,.html,.htm,.json,.csv,.rst">

<aside id="settings" class="drawer" hidden>
  <form id="settings-form">
    <header>
      <h2 data-i18n="settings">Réglages</h2>
      <button type="button" id="settings-close" aria-label="Fermer">×</button>
    </header>
    <p id="settings-source" class="muted"></p>
    <label><span data-i18n="endpoint">Point d'accès</span>
      <input name="endpoint" type="url" autocomplete="off" required>
    </label>
    <label><span data-i18n="model">Modèle</span>
      <input name="model" type="text" autocomplete="off" required>
    </label>
    <label><span data-i18n="apiKey">Clé</span>
      <input name="api_key" type="password" autocomplete="off" placeholder="••••">
    </label>
    <p class="muted" data-i18n="keyHelp">Laisser vide conserve la clé déjà enregistrée.</p>
    <div class="paste-actions">
      <button type="button" id="test-connection" data-i18n="test">Tester la connexion</button>
      <button type="submit" data-i18n="save">Enregistrer</button>
    </div>
    <p id="test-result" class="muted"></p>
    <details>
      <summary data-i18n="advanced">Options avancées</summary>
      <label><span data-i18n="chunk">Taille d'une partie (caractères)</span>
        <input name="chunk_chars" type="number" min="500" max="100000" step="100">
      </label>
      <label><span data-i18n="timeout">Délai d'une réponse (secondes)</span>
        <input name="timeout_s" type="number" min="5" max="3600" step="1">
      </label>
      <label><span data-i18n="maxTokens">Longueur max. d'une réponse</span>
        <input name="max_tokens" type="number" min="256" max="128000" step="1">
      </label>
      <label><span data-i18n="watch">Dossier à importer</span>
        <input name="watch_dir" type="text" autocomplete="off" placeholder="/chemin/vers/dossier">
      </label>
    </details>
  </form>
</aside>

<div id="drop-overlay" class="drop-overlay" hidden>
  <p data-i18n="dropNow">Déposer pour extraire</p>
  <p id="drop-name"></p>
</div>

<div id="tour" class="tour" hidden>
  <div class="tour-card" role="dialog" aria-labelledby="tour-title">
    <h2 id="tour-title"></h2>
    <p id="tour-body"></p>
    <div class="paste-actions">
      <button type="button" id="tour-skip" data-i18n="tourSkip">Passer</button>
      <button type="button" id="tour-next" class="primary" data-i18n="tourNext">Suivant</button>
    </div>
  </div>
</div>
<script src="/assets/vendor/vis-network.min.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/extra.js"></script>
</body>
</html>
